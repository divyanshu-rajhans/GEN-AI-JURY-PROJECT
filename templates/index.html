<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Onset Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Diabetes Onset Prediction</h1>

        <form method="POST">
            <div class="grid">
                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select...</option>
                        {% for opt in categorical_options['gender'] %}
                        <option value="{{ opt }}" {% if form_data.get('gender') == opt %}selected{% endif %}>{{ opt }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field">
                    <label for="age">Age (years)</label>
                    <input type="number" step="0.1" id="age" name="age" min="0.1" max="120" value="{{ form_data.get('age', '') }}" required>
                </div>

                <div class="field">
                    <label for="hypertension">Hypertension</label>
                    <select id="hypertension" name="hypertension" required>
                        <option value="">Select...</option>
                        <option value="0" {% if form_data.get('hypertension') == '0' %}selected{% endif %}>No (0)</option>
                        <option value="1" {% if form_data.get('hypertension') == '1' %}selected{% endif %}>Yes (1)</option>
                    </select>
                </div>

                <div class="field">
                    <label for="heart_disease">Heart Disease</label>
                    <select id="heart_disease" name="heart_disease" required>
                        <option value="">Select...</option>
                        <option value="0" {% if form_data.get('heart_disease') == '0' %}selected{% endif %}>No (0)</option>
                        <option value="1" {% if form_data.get('heart_disease') == '1' %}selected{% endif %}>Yes (1)</option>
                    </select>
                </div>

                <div class="field">
                    <label for="smoking_history">Smoking History</label>
                    <select id="smoking_history" name="smoking_history" required>
                        <option value="">Select...</option>
                        {% for opt in categorical_options['smoking_history'] %}
                        <option value="{{ opt }}" {% if form_data.get('smoking_history') == opt %}selected{% endif %}>{{ opt }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field">
                    <label for="bmi">BMI (10 - 100)</label>
                    <input type="number" step="0.01" id="bmi" name="bmi" min="10" max="100" value="{{ form_data.get('bmi', '') }}" required>
                </div>

                <div class="field">
                    <label for="HbA1c_level">HbA1c Level (3.0 - 15.0)</label>
                    <input type="number" step="0.1" id="HbA1c_level" name="HbA1c_level" min="3.0" max="15.0" value="{{ form_data.get('HbA1c_level', '') }}" required>
                </div>

                <div class="field">
                    <label for="blood_glucose_level">Blood Glucose Level (mg/dL)</label>
                    <input type="number" step="1" id="blood_glucose_level" name="blood_glucose_level" min="50" max="400" value="{{ form_data.get('blood_glucose_level', '') }}" required>
                </div>
            </div>

            <button type="submit">Predict Diabetes Risk</button>
        </form>

        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}

        {% if prediction %}
        <div class="alert {{ prediction.status }}">
            <div class="result-title">{{ prediction.label }}</div>
            <div class="prob">Estimated Risk Probability: {{ prediction.probability }}</div>
            <div>{{ prediction.message }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
